{% extends "companion/base.html" %}

{% block header_buttons %}

<button class="logout-button" onclick="window.location.href='{% url 'logout' %}'">Logout</button>
{% endblock %}

{% block content %}
<div class="main-center">
    <div class="role-cards">

    </div>
</div>
{% endblock %}
