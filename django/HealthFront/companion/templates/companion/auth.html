{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Lakeland Regional Health</title>
    <link rel="stylesheet" href="{% static 'companion/css/styles.css' %}">
    <script defer src="{% static 'companion/js/app.js' %}"></script>
</head>

<body>
<div class="login-page">

    <!-- LEFT: Form panel -->
    <div class="login-panel">

        <!-- Branding -->
        <div class="hospital-brand">
            <div class="brand-cross"></div>
            <div class="brand-name">Lakeland Regional<br>Health Companion</div>
        </div>

        <!-- Heading -->
        <h1 class="welcome-heading">Welcome Back</h1>
        <p class="welcome-sub">Sign in to continue to your portal.</p>

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="{% url 'auth' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Login</button>

            <div id="loginMessage" style="color:var(--error); font-size:0.87rem; text-align:center; margin-top:0.75rem;">
                {{ message }}
            </div>
        </form>

        <p class="signup-link">Don't have an account? <a href="#" id="showSignup">Sign Up</a></p>

        <!-- Signup Form (hidden by default) -->
        <form id="signupForm" style="display:none; margin-top:1.5rem;">
            <h2 style="margin-bottom:1.25rem; font-size:1.3rem;">Create Account</h2>

            <div class="form-group">
                <label for="newUsername">Username</label>
                <input type="text" id="newUsername" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="newPassword">Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" required>
                <div id="signupPasswordStrength"></div>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
            <div id="signupMessage" style="color:var(--success); font-size:0.87rem; text-align:center; margin-top:0.75rem;"></div>
        </form>

    </div>

</div>
</body>
</html>
