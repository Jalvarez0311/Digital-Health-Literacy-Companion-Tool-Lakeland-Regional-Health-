{% extends "companion/base.html" %}

{% block title %}Login{% endblock %}

{% block header_buttons %}
<button class="back-button" onclick="window.history.back()">← Back</button>
{% endblock %}

{% block header_title %}Login{% endblock %}

{% block content %}
<div class="main-center">
    <form id="login-form">
        <!-- Preserve the role from previous page -->
        <input type="hidden" id="role" value="{{ request.GET.role }}">
        <div>
            <label>Username</label>
            <input type="text" id="username" required>
        </div>
        <div>
            <label>Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Login</button>
        <p id="error-msg" style="color:red; display:none;">Invalid login</p>
    </form>

    <p style="margin-top:1rem;">
        Don't have an account? 
        <a href="/signup/?role={{ request.GET.role }}">Sign up here</a>
    </p>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const role = document.getElementById('role').value;
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Test login logic
    if(role === 'nurse' && username === 'admin' && password === 'test') {
        window.location.href = "/dashboard/nurse/";
    } else if(role === 'patient' && username === 'admin' && password === 'test') {
        window.location.href = "/dashboard/patient/";
    } else {
        document.getElementById('error-msg').style.display = 'block';
    }
});
</script>
{% endblock %}
